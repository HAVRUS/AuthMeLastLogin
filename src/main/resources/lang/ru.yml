# Весь текст, который видят игроки в чате. Поддерживаются цветовые коды '&'.
# Плейсхолдеры (%player%, %time%, %label%) должны остаться где-то в строке,
# но их можно переставлять местами или убирать лишние - остальное переводите
# как хотите.
#
# Строки консоли (предупреждения, ошибки, сообщения запуска) в этот файл
# не входят - они остаются на английском для администратора сервера.

last-login:
  header: "&6=== Время последнего входа ==="
  line: "&f%time%&7: &e%player%"
  never: "&fникогда не заходил&7: &e%player%"

command:
  usage-show: "&cИспользование: /%label% show"
  usage-motd: "&cИспользование: /%label% motd <enable|disable>"
  usage-reload: "&cИспользование: /%label% reload"
  no-permission: "&cУ вас нет прав для этого действия."
  motd-enabled: "&aАвтоматическое сообщение при входе теперь &lвключено&r&a."
  motd-disabled: "&cАвтоматическое сообщение при входе теперь &lвыключено&r&c."
  reload-success: "&aКонфигурация и файл языка перезагружены."
